<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>onder balta - game developer</title>
  <meta id="metaDescription" name="description" content="A three-dimensional portfolio space by onder balta.">
  <meta name="theme-color" content="#030403">
  <link rel="icon" type="image/png" href="assets/optimized-media/browser-icon.png">
  <link rel="apple-touch-icon" href="assets/optimized-media/browser-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="room-stage" aria-label="3D portfolio space">
    <canvas
      id="roomCanvas"
      class="room-canvas"
      role="img"
      aria-label="An empty white room viewed from its center"
    ></canvas>
    <div
      id="loadingScreen"
      class="loading-screen"
      role="status"
      aria-live="polite"
      aria-hidden="false"
    >
      <div class="loading-window" aria-label="Loading 3D portfolio">
        <div class="loading-window-bar">
          <span>system_boot.exe</span>
          <span class="loading-window-control" aria-hidden="true">×</span>
        </div>
        <div class="loading-window-content">
          <p id="loadingStatus" class="loading-status">initializing display</p>
          <div
            class="loading-progress-track"
            role="progressbar"
            aria-label="Loading progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="loadingProgressBar" class="loading-progress-bar"></span>
          </div>
          <div class="loading-readout" aria-hidden="true">
            <span id="loadingPercent">00%</span>
            <span id="loadingActivity">please wait</span>
          </div>
        </div>
      </div>
    </div>
    <p id="webglFallback" class="webgl-fallback" hidden>
      This 3D space requires WebGL to be enabled in your browser.
    </p>
    <span id="viewCursor" class="view-cursor" aria-hidden="true">view</span>
    <header id="siteHeader" class="site-header" aria-hidden="true" inert>
      <canvas
        id="headerWordmark"
        class="header-wordmark"
        role="img"
        aria-label="onder balta"
      ></canvas>
      <nav id="primaryNav" class="header-nav" aria-label="Primary navigation">
        <button id="homeButton" class="header-nav-item is-current" type="button" aria-current="page">
          home
        </button>
        <button id="aboutMeButton" class="header-nav-item" type="button">
          about me
        </button>
        <button
          id="languageSwitch"
          class="language-switch"
          type="button"
          aria-label="Switch language to Turkish"
        >
          <span id="languageEnglish" class="language-option is-active">en</span>
          <span class="language-divider" aria-hidden="true">/</span>
          <span id="languageTurkish" class="language-option">tr</span>
        </button>
      </nav>
    </header>
    <aside
      id="aboutWindow"
      class="about-window"
      role="dialog"
      aria-labelledby="aboutWindowTitle"
      aria-hidden="true"
      inert
    >
      <div id="aboutWindowBar" class="about-window-bar">
        <span id="aboutWindowTitle">about_me.txt</span>
        <button
          id="aboutWindowClose"
          class="about-window-close"
          type="button"
          aria-label="Close about window"
        >
          ×
        </button>
      </div>
      <div class="header-info">
        <p
          id="headerInfoText"
              data-text="Hey, Im Önder. I am an information systems engineering graduate and a game developer interested in technical art and stylized graphics. Currently developing our own game, Delivery Guy Simulator, as bicycle club. If you find it interesting, please check it out and consider adding it to your wishlist."
              aria-label="Hey, Im Önder. I am an information systems engineering graduate and a game developer interested in technical art and stylized graphics. Currently developing our own game, Delivery Guy Simulator, as bicycle club. If you find it interesting, please check it out and consider adding it to your wishlist."
        ></p>
        <button id="aboutGameButton" class="about-game-button" type="button">
          show delivery guy simulator
        </button>
      </div>
    </aside>
    <aside id="projectPanel" class="project-panel" aria-hidden="true" inert>
      <div class="project-window-bar">
        <span id="projectWindowTitle">project_view.exe</span>
        <button
          id="projectClose"
          class="project-close"
          type="button"
          aria-label="Close project view"
        >
          ×
        </button>
      </div>
      <div class="project-window-content">
        <p id="projectMeta" class="project-meta"></p>
        <h2 id="projectTitle" class="project-title"></h2>
        <p id="projectDescription" class="project-description"></p>
        <button id="projectPreview" class="project-preview" type="button" hidden>
          <video
            id="projectPreviewVideo"
            muted
            loop
            playsinline
            preload="metadata"
            hidden
          ></video>
          <img id="projectPreviewImage" alt="" hidden>
          <span id="projectPreviewLabel" class="project-preview-label"></span>
        </button>
        <a
          id="projectLink"
          class="project-link"
          target="_blank"
          rel="noreferrer"
          hidden
        >
          visit project
        </a>
      </div>
    </aside>
    <section
      id="cleanView"
      class="clean-view"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cleanViewTitle"
      aria-hidden="true"
      inert
    >
      <div class="clean-player-shell">
        <div class="clean-player-bar">
          <button id="cleanViewClose" class="clean-view-close" type="button">
            back to room
          </button>
          <p id="cleanViewTitle" class="clean-view-title"></p>
          <div id="cleanGalleryNav" class="clean-gallery-nav" hidden>
            <button id="cleanGalleryPrev" type="button" aria-label="Previous image">
              prev
            </button>
            <span id="cleanGalleryCount" aria-live="polite"></span>
            <button id="cleanGalleryNext" type="button" aria-label="Next image">
              next
            </button>
          </div>
        </div>
        <div class="clean-media-frame">
          <video
            id="cleanVideo"
            controls
            playsinline
            preload="metadata"
          ></video>
          <img id="cleanImage" alt="" hidden>
        </div>
      </div>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
